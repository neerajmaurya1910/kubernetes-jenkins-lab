apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set14
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-set14
  template:
    metadata:
      labels:
        app: lab-set14
    spec:
      containers:
        - name: nginx
          image: nginx:invalid-lab-tag
          ports:
            - containerPort: 80
