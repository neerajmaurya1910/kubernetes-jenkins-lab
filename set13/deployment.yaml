apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set13
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: lab-set13
  template:
    metadata:
      labels:
        app: lab-set13
    spec:
      containers:
        - name: nginx
          image: nginx:1.26-alpine
          ports:
            - containerPort: 80
