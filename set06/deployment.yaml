apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set06
  labels:
    app: lab-set06
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-set06
  template:
    metadata:
      labels:
        app: lab-set06
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
