apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set15
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-set15
  template:
    metadata:
      labels:
        app: lab-set15
    spec:
      containers:
        - name: web
          image: lab-set15-web:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lab-set15-service
spec:
  type: NodePort
  selector:
    app: lab-set15
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30095
