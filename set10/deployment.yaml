apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set10
  labels:
    app: lab-set10
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-set10
  template:
    metadata:
      labels:
        app: lab-set10
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
