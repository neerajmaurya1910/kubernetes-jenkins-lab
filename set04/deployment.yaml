apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set04
  labels:
    app: lab-set04
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lab-set04
  template:
    metadata:
      labels:
        app: lab-set04
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
