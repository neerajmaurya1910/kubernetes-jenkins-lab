apiVersion: v1
kind: Pod
metadata:
  name: lab-set09
  labels:
    app: lab-set09
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html/data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: lab-set09-pvc
